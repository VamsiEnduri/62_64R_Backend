<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Contact Form</title>

<style>
/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Poppins", sans-serif;
}

/* ===== GRADIENT BACKGROUND ===== */
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(120deg,#6a11cb,#2575fc,#00c6ff);
    background-size:300% 300%;
    animation: gradientBG 8s ease infinite;
}

/* ===== BACKGROUND ANIMATION ===== */
@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ===== FORM CONTAINER ===== */
.contact-card{
    width:380px;
    padding:35px;
    border-radius:20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    transform-style: preserve-3d;
    transition: transform 0.6s ease;
}

/* 3D hover tilt */
.contact-card:hover{
    transform: rotateY(8deg) rotateX(5deg) scale(1.03);
}

/* ===== TITLE ===== */
.contact-card h2{
    text-align:center;
    color:#fff;
    margin-bottom:25px;
    letter-spacing:1px;
}

/* ===== INPUT BOX ===== */
.input-box{
    position:relative;
    margin-bottom:22px;
}

/* input & textarea */
.input-box input,
.input-box textarea{
    width:100%;
    padding:14px 12px;
    border:none;
    outline:none;
    background: rgba(255,255,255,0.25);
    border-radius:12px;
    color:#fff;
    font-size:15px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.2);
}

/* textarea height */
.input-box textarea{
    resize:none;
    height:100px;
}

/* floating label */
.input-box label{
    position:absolute;
    top:50%;
    left:12px;
    color:#eee;
    font-size:14px;
    transform: translateY(-50%);
    pointer-events:none;
    transition:0.3s;
}

/* label animation */
.input-box input:focus + label,
.input-box input:valid + label,
.input-box textarea:focus + label,
.input-box textarea:valid + label{
    top:-8px;
    font-size:12px;
    color:#00eaff;
}

/* ===== BUTTON ===== */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background: linear-gradient(135deg,#00eaff,#00ffb3);
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    transition: all 0.4s ease;
}

/* button hover */
button:hover{
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* ===== SMALL TEXT ===== */
.note{
    margin-top:15px;
    text-align:center;
    font-size:13px;
    color:#e0e0e0;
}
</style>
</head>

<body>

<div class="contact-card">
    <h2>Contact Us</h2>

    <form>
        <div class="input-box">
            <input type="text" required>
            <label>Full Name</label>
        </div>

        <div class="input-box">
            <input type="email" required>
            <label>Email Address</label>
        </div>

        <div class="input-box">
            <textarea required></textarea>
            <label>Your Message</label>
        </div>

        <button type="submit">Send Message 🚀</button>
    </form>

    <div class="note">
        We’ll get back to you within 24 hours
    </div>
</div>

</body>
</html>
